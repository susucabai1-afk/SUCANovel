# ==============================================
# KONFIGURASI PRODUKSI CLOUDFLARE
# Hosting Gratis — Selamanya
# ==============================================

name = "sucanovel"
main = "src/workers/index.ts"
compatibility_date = "2024-01-01"
account_id = "ID_ACCOUNT_CLOUDFLARE_KAMU"

[vars]
ENVIRONMENT = "production"
SITE_NAME = "SUCANovel"
ADMIN_PANEL_PATH = "/admin-secret-2026" # ⚠️ GANTI DENGAN PATH RAHASIA!

[[d1_databases]]
binding = "DB"
database_name = "sucanovel-db"
database_id = "ID_DATABASE_D1_KAMU"

[[kv_namespaces]]
binding = "KV"
id = "ID_KV_STORAGE_KAMU"

[[r2_buckets]]
binding = "R2"
bucket_name = "sucanovel-assets"

[triggers]
routes = ["sucanovel.com/*"]

[limits]
cpu_ms = 50
memory = 128

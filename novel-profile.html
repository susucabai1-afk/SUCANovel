<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Novel — SUCA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <button class="back-btn" onclick="history.back()">←</button>
    <h1 class="logo" onclick="location.href='index.html'">📖 SUCA</h1>
    <div class="header-right">
      <button class="icon-btn" id="like-btn">❤️ <span id="like-count">0</span></button>
    </div>
  </header>

  <!-- Konten Profil Novel -->
  <main class="container" id="profile-content">
    <div class="novel-profile-header">
      <img id="novel-cover" src="" alt="Cover" class="profile-cover">
      <div class="profile-info">
        <h2 id="novel-title">—</h2>
        <p class="author">✍️ <span id="novel-author">—</span></p>
        <span class="genre-tag" id="novel-genre">—</span>
        <div class="profile-stats">
          <span>👁 <span id="novel-views">0</span></span>
          <span>❤️ <span id="novel-likes">0</span></span>
          <span>⭐ <span id="novel-stars">0</span></span>
        </div>
        <p class="status-badge" id="novel-status">Sedang Berjalan</p>
      </div>
    </div>

    <!-- Deskripsi -->
    <div class="profile-section">
      <h3>📝 Deskripsi</h3>
      <p id="novel-description">—</p>
    </div>

    <!-- Tombol Aksi -->
    <div class="action-buttons">
      <button class="btn-primary" id="start-read-btn">📖 Mulai Membaca</button>
      <button class="btn-donate" id="donate-btn">💰 Donasi Penulis</button>
    </div>

    <!-- Daftar Bab -->
    <div class="profile-section">
      <h3>📚 Daftar Bab (<span id="chapters-count">0</span>)</h3>
      <div class="chapter-list" id="chapter-list"></div>
    </div>

    <!-- Riwayat Donasi -->
    <div class="profile-section">
      <h3>💰 Donasi Pembaca</h3>
      <div class="donation-list" id="donation-list"></div>
    </div>
  </main>

  <!-- Modal Donasi -->
  <div id="donate-modal" class="modal">
    <div class="modal-box">
      <h3>💰 Donasi untuk Penulis</h3>
      <input type="number" id="donate-amount" placeholder="Jumlah (Rp)" class="admin-input" min="1000">
      <textarea id="donate-msg" placeholder="Pesan untuk penulis (opsional)" class="admin-input" rows="3"></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeDonateModal()">Batal</button>
        <button class="btn-primary" onclick="submitDonation()">Kirim Donasi</button>
      </div>
    </div>
  </div>

  <!-- Navigasi Bawah -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-link">🏠 Beranda</a>
    <a href="novels.html" class="nav-link">📚 Novel</a>
    <a href="history.html" class="nav-link">📖 Riwayat</a>
    <a href="events.html" class="nav-link">🎉 Event</a>
    <a href="about.html" class="nav-link">ℹ️ Tentang</a>
  </nav>

  <script type="module">
    import { supabase, APP_STATE } from './app.js';

    // === AMBIL ID NOVEL DARI LINK ===
    const novelId = new URLSearchParams(window.location.search).get('id');
    let currentNovel = null;
    let chapters = [];

    if (!novelId) {
      alert('Novel tidak ditemukan!');
      location.href = 'index.html';
    }

    // === MUAT DATA NOVEL ===
    async function loadNovelProfile() {
      // Data utama novel
      const { data: novel } = await supabase
        .from('novels')
        .select('*')
        .eq('id', novelId)
        .single();

      if (!novel) return;
      currentNovel = novel;

      // Tampilkan cover & data
      document.getElementById('novel-cover').src = novel.cover_url || 'https://via.placeholder.com/300x400?text=SUCA';
      document.getElementById('novel-title').textContent = novel.title;
      document.getElementById('novel-author').textContent = novel.author;
      document.getElementById('novel-genre').textContent = novel.genre;
      document.getElementById('novel-views').textContent = novel.views;
      document.getElementById('novel-likes').textContent = novel.likes_count || 0;
      document.getElementById('novel-stars').textContent = novel.stars || 0;
      document.getElementById('novel-description').textContent = novel.description || 'Belum ada deskripsi.';
      document.getElementById('novel-status').textContent = novel.status === 'completed' ? '✅ Sudah Tamat' : '📖 Sedang Berjalan';

      // Muat daftar bab
      await loadChapters();
      
      // Cek apakah user sudah suka
      await checkUserLiked();

      // Muat daftar donasi
      await loadDonations();
    }

    // === MUAT DAFTAR BAB ===
    async function loadChapters() {
      const { data } = await supabase
        .from('chapters')
        .select('*')
        .eq('novel_id', novelId)
        .order('chapter_number', { ascending: true });
      
      chapters = data || [];
      document.getElementById('chapters-count').textContent = chapters.length;
      
      const listEl = document.getElementById('chapter-list');
      listEl.innerHTML = chapters.map(ch => `
        <div class="chapter-item" onclick="openChapter(${ch.id}, ${ch.chapter_number})">
          <span class="chap-num">Bab ${ch.chapter_number}</span>
          <span class="chap-title">${ch.title}</span>
        </div>
      `).join('');
    }

    // === SUKA NOVEL ===
    async function checkUserLiked() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      const { data } = await supabase
        .from('novel_likes')
        .select('id')
        .eq('user_id', user.id)
        .eq('novel_id', novelId)
        .maybeSingle();

      const likeBtn = document.getElementById('like-btn');
      if (data) {
        likeBtn.classList.add('liked');
        likeBtn.onclick = unlikeNovel;
      } else {
        likeBtn.classList.remove('liked');
        likeBtn.onclick = likeNovel;
      }
    }

    async function likeNovel() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert('Silakan masuk terlebih dahulu!');

      await supabase.from('novel_likes').insert({ user_id: user.id, novel_id: novelId });
      await supabase.rpc('increment_likes', { novel_id: novelId });
      currentNovel.likes_count++;
      document.getElementById('novel-likes').textContent = currentNovel.likes_count;
      await checkUserLiked();
    }

    async function unlikeNovel() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return;

      await supabase.from('novel_likes').delete().match({ user_id: user.id, novel_id: novelId });
      await supabase.rpc('decrement_likes', { novel_id: novelId });
      currentNovel.likes_count--;
      document.getElementById('novel-likes').textContent = currentNovel.likes_count;
      await checkUserLiked();
    }

    // === BUKA BAB ===
    window.openChapter = (chapterId, chapNum) => {
      location.href = `novel-read.html?novel=${novelId}&chapter=${chapterId}&num=${chapNum}`;
    };

    // === MULAI BACA ===
    document.getElementById('start-read-btn').addEventListener('click', () => {
      if (chapters.length > 0) openChapter(chapters[0].id, chapters[0].chapter_number);
      else alert('Belum ada bab tersedia.');
    });

    // === DONASI ===
    window.openDonateModal = () => document.getElementById('donate-modal').classList.add('active');
    window.closeDonateModal = () => document.getElementById('donate-modal').classList.remove('active');

    document.getElementById('donate-btn').addEventListener('click', openDonateModal);

    window.submitDonation = async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert('Silakan masuk terlebih dahulu!');
      
      const amount = parseInt(document.getElementById('donate-amount').value);
      const message = document.getElementById('donate-msg').value;
      
      if (!amount || amount < 1000) return alert('Minimal donasi Rp 1.000');

      await supabase.from('donations').insert({
        user_id: user.id,
        novel_id: novelId,
        amount,
        message
      });

      alert('✅ Terima kasih atas donasinya!');
      closeDonateModal();
      document.getElementById('donate-amount').value = '';
      document.getElementById('donate-msg').value = '';
      await loadDonations();
    };

    async function loadDonations() {
      const { data } = await supabase
        .from('donations')
        .select('amount, message, created_at')
        .eq('novel_id', novelId)
        .order('created_at', { ascending: false })
        .limit(10);

      const listEl = document.getElementById('donation-list');
      if (!data || data.length === 0) {
        listEl.innerHTML = '<p class="muted">Belum ada donasi. Jadilah yang pertama! 💝</p>';
        return;
      }
      listEl.innerHTML = data.map(d => `
        <div class="donation-item">
          <strong>💰 Rp ${d.amount.toLocaleString('id-ID')}</strong>
          ${d.message ? `<p>"${d.message}"</p>` : ''}
          <small>${new Date(d.created_at).toLocaleDateString('id-ID')}</small>
        </div>
      `).join('');
    }

    // === JALANKAN SAAT HALAMAN DIBUKA ===
    loadNovelProfile();
  </script>
</body>
  </html>

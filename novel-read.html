<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membaca — SUCA</title>
  <link rel="stylesheet" href="styles.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Header Baca -->
  <header class="header">
    <button class="back-btn" onclick="history.back()">←</button>
    <div class="chapter-header-info">
      <h3 id="chapter-title">—</h3>
      <p id="novel-title-link" class="muted small"></p>
    </div>
  </header>

  <!-- Isi Bab -->
  <main class="container">
    <div class="chapter-content" id="chapter-content">Memuat...</div>

<!-- 📺 IKLAN DI DALAM BAB -->
     <div class="ad-box">
       <ins class="adsbygoogle"
            style="display:block"
            data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
            data-ad-slot="1234567890"
            data-ad-format="auto"
            data-full-width-responsive="true"></ins>
       <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
     </div>
    
    <!-- Navigasi Bab -->
    <div class="chapter-nav">
      <button id="prev-btn" class="nav-chap-btn">← Bab Sebelumnya</button>
      <button id="next-btn" class="nav-chap-btn">Bab Berikutnya →</button>
    </div>

    <!-- Garis Pemisah -->
    <hr class="divider">

    <!-- 💬 KOMENTAR PER BAB -->
    <div class="comments-section">
      <h3>💬 Komentar Bab Ini (<span id="comment-count">0</span>)</h3>
      
      <!-- Form Kirim Komentar -->
      <div class="comment-form">
        <textarea id="comment-input" placeholder="Tulis komentarmu..." class="admin-input" rows="3"></textarea>
        <button id="submit-comment" class="btn-primary">Kirim Komentar</button>
      </div>

      <!-- Daftar Komentar -->
      <div class="comment-list" id="comment-list"></div>
    </div>
  </main>

  <script type="module">
    import { supabase, saveToHistory } from './app.js';

    // Ambil ID dari URL
    const params = new URLSearchParams(window.location.search);
    const novelId = params.get('novel');
    const chapterId = params.get('chapter');
    const chapterNum = params.get('num');
    
    let allChapters = [];
    let currentIndex = 0;

    if (!novelId || !chapterId) {
      alert('Link tidak valid!');
      location.href = 'index.html';
    }
    
    // === 📺 PENGATURAN IKLAN — MUNCUL 1X SAJA PER BAB ===
const AD_SETTINGS = {
  enableAds: true,              // Matikan iklan = false
  showOncePerChapter: true,     // 1x per bab saja
  adFrequency: 1,               // 1 = tiap bab, 2 = tiap 2 bab, dst
  skipChapters: 3               // Lewat N bab pertama sebelum iklan muncul
};

function shouldShowAd(chapterId, chapterNumber) {
  if (!AD_SETTINGS.enableAds) return false;
  
  // Lewat bab pertama sesuai pengaturan
  if (chapterNumber <= AD_SETTINGS.skipChapters) return false;
  
  // Frekuensi iklan
  if ((chapterNumber - AD_SETTINGS.skipChapters) % AD_SETTINGS.adFrequency !== 0) return false;
  
  // Cek apakah sudah pernah dilihat bab ini (pakai localStorage)
  const viewedChapters = JSON.parse(localStorage.getItem('viewed_chapters') || '{}');
  if (AD_SETTINGS.showOncePerChapter && viewedChapters[chapterId]) {
    return false; // Sudah pernah dibaca → tidak tampilkan iklan lagi
  }
  
  // Tandai sebagai sudah dilihat
  viewedChapters[chapterId] = true;
  localStorage.setItem('viewed_chapters', JSON.stringify(viewedChapters));
  return true;
}

// === GUNAKAN FUNGSI INI SAAT BAB DIMUAT ===
// Di dalam fungsi loadChapterContent(), tambahkan:
async function loadChapterContent() {
  // ... kode yang sudah ada ...
  
  // Tampilkan/sembunyikan iklan sesuai aturan
  const adBox = document.querySelector('.ad-box');
  if (adBox) {
    if (shouldShowAd(chapterId, chapter.chapter_number)) {
      adBox.style.display = 'block';
      // Muat ulang iklan untuk tampil
      if (window.adsbygoogle) adsbygoogle.push({});
    } else {
      adBox.style.display = 'none';
    }
  }
}


    // === MUAT SEMUA BAB (untuk navigasi) ===
    async function loadAllChapters() {
      const { data } = await supabase
        .from('chapters')
        .select('id, chapter_number, title')
        .eq('novel_id', novelId)
        .order('chapter_number', { ascending: true });
      
      allChapters = data || [];
      currentIndex = allChapters.findIndex(c => c.id == chapterId);
      
      updateNavButtons();
    }

    // === MUAT ISI BAB ===
    async function loadChapterContent() {
      await loadAllChapters();
      
      const { data: chapter } = await supabase
        .from('chapters')
        .select('*')
        .eq('id', chapterId)
        .single();
      
      if (!chapter) return;

      document.getElementById('chapter-title').textContent = `Bab ${chapter.chapter_number}: ${chapter.title}`;
      document.getElementById('chapter-content').textContent = chapter.content;
      
      // Simpan ke riwayat baca
      await saveToHistory(novelId, chapterId);
      
      // Muat komentar bab ini
      await loadComments();
    }

    // === UPDATE TOMBOL NAVIGASI ===
    function updateNavButtons() {
      document.getElementById('prev-btn').disabled = currentIndex <= 0;
      document.getElementById('next-btn').disabled = currentIndex >= allChapters.length - 1;
    }

    // Navigasi bab
    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentIndex > 0) {
        const prev = allChapters[currentIndex - 1];
        location.href = `novel-read.html?novel=${novelId}&chapter=${prev.id}&num=${prev.chapter_number}`;
      }
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      if (currentIndex < allChapters.length - 1) {
        const next = allChapters[currentIndex + 1];
        location.href = `novel-read.html?novel=${novelId}&chapter=${next.id}&num=${next.chapter_number}`;
      }
    });

    // === 💬 SISTEM KOMENTAR PER BAB ===
    async function loadComments() {
      const { data } = await supabase
        .from('chapter_comments')
        .select(`
          id, content, created_at,
          user:user_id(username)
        `)
        .eq('chapter_id', chapterId)
        .order('created_at', { ascending: false });

      document.getElementById('comment-count').textContent = data?.length || 0;
      
      const listEl = document.getElementById('comment-list');
      if (!data || data.length === 0) {
        listEl.innerHTML = '<p class="muted">Belum ada komentar. Jadilah yang pertama berkomentar!</p>';
        return;
      }

      listEl.innerHTML = data.map(c => `
        <div class="comment-item">
          <div class="comment-header">
            <strong>${c.user?.username || 'Pengguna Anonim'}</strong>
            <small>${new Date(c.created_at).toLocaleString('id-ID')}</small>
          </div>
          <p class="comment-text">${c.content}</p>
        </div>
      `).join('');
    }

    // Kirim komentar
    document.getElementById('submit-comment').addEventListener('click', async () => {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) return alert('Silakan masuk untuk berkomentar!');
      
      const content = document.getElementById('comment-input').value.trim();
      if (!content) return alert('Komentar tidak boleh kosong!');

      await supabase.from('chapter_comments').insert({
        chapter_id: chapterId,
        user_id: user.id,
        content
      });

      // Notifikasi ke penulis (bisa ditambahkan)
      document.getElementById('comment-input').value = '';
      await loadComments();
    });

    // Jalankan
    loadChapterContent();
  </script>
</body>
</html>
